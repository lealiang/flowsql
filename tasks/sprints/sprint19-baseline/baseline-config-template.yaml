# Baseline unified config template
# Source snapshot date: 2026-04-26
# This file separates:
# 1) task payload templates (configurable by Create*Task JSON)
# 2) built-in defaults/constants (not configurable by task JSON today)

task_templates:
  value_task_t1a:
    name: "bytes_total"
    key: "service"
    feature: "bytes_total"
    feature_type: "t1a"
    feature_profile: "default"
    delta: 60
    tz: "Asia/Shanghai"
    baseline_source_configs: []
    event_calendar_spec: null

  value_task_t1b:
    name: "avg_rtt"
    key: "service"
    feature: "avg_rtt"
    feature_type: "t1b"
    feature_profile: "cont_core"   # cont_core | cont_tail
    delta: 60
    tz: "Asia/Shanghai"
    baseline_source_configs: []
    event_calendar_spec: null

  ratio_task_t2:
    name: "success_rate"
    key: "service"
    feature: "success_rate"
    feature_type: "t2"             # t2 | ratio
    feature_profile: "rate_core"   # rate_core | ratio_bursty
    delta: 60
    tz: "Asia/Shanghai"
    baseline_source_configs: []
    event_calendar_spec: null

  relation_task_t3:
    name: "client_group_mix"
    feature_base: "client_group_mix"
    group_space_id: "client_group"
    group_space_version: "v1"
    metric_set_id: "net_metrics"
    metrics:
      - "conn_count"
      - "bps"
    encode_type: "exact_sparse"    # exact_sparse | topk_other
    other_group_idxs: []           # optional; only valid for topk_other
    support_policy:
      k_support: 16                # requested default
      min_hist_share: 0.005        # requested default (0.5%)
      min_active_ratio: 0.2        # requested default (20%)
    summary_policy:
      k_head: 5                    # requested default
      k_stable: 5                  # requested default
    delta: 60
    tz: "Asia/Shanghai"
    event_calendar_spec: null

common_optional_blocks:
  baseline_source_configs_example:
    - key: "svc-target"
      baseline_sources:
        - source_key: "svc-source-a"
        - source_key: "svc-source-b"

  event_calendar_spec_example:
    calendar_id: "ops-calendar"
    calendar_version: "v1"
    entries:
      - event_code: "month_close"
        scope_type: "global"         # global | feature | key | key_feature
        alignment_mode: "local_wall_clock"  # local_wall_clock | absolute_utc
        start_ts: 1711900800
        end_ts: 1711987199
        enabled: true
        feature: ""
        key: ""
        tz: "Asia/Shanghai"

builtin_defaults:
  configurable_via_task_json: false

  parser_level_defaults:
    tz_default: "Asia/Shanghai"

  shared_profile_config:
    # src/plugins/baseline/model/profile_config.h
    k_day: 4
    k_week: 3
    dme_max: 7
    m_month_enable: 4
    month_cov_min: 0.8
    lambda_season: 1.0
    lambda_dom: 4.0
    lambda_dme: 2.0
    lambda_lwd: 1.0
    lambda_event: 2.0
    n_val_switch: 16
    eps_switch: 0.05
    z_warn: 3.0
    z_crit: 5.0
    w_shift: 0.8
    drift:
      alpha: 0.2
      shift_clip: 6.0
      lambda_mem: 0.9
      kappa_shift: 0.25
      u_min: 0.5
      h_shift: 3.0
      p_shift_low: 0.3
      p_shift_high: 0.6
      m_shift: 3
      g_skip: 3
      g_reset: 12

  t1b_profiles:
    cont_core:
      n_train_min: 50
      n_score_min: 25
      n_shift_min: 100
      kappa_sample: 50
      transform_name_override: "log1p"
    cont_tail:
      n_train_min: 100
      n_score_min: 50
      n_shift_min: 200
      kappa_sample: 100
      transform_name_override: "log1p"

  t2_profiles:
    global:
      eps_logit: 1.0e-4
      m_floor: 1.0e-4
      v_floor: 0.25
    rate_core:
      d_min_train: 50
      d_score_min: 25
      d_shift_min: 100
      kappa_den: 50
      s_prior: 2.0
      phi_over: 1.5
    ratio_bursty:
      d_min_train: 100
      d_score_min: 50
      d_shift_min: 200
      kappa_den: 100
      s_prior: 4.0
      phi_over: 2.0

  runtime_and_rebuild_constants:
    runtime_state_prune:
      idle_bucket_gap: 4096
      prune_scan_limit: 32
    candidate_builder:
      min_train_point_count: 2
    candidate_validator:
      huber_delta: 1.5
      shadow_alpha: 0.2
      ratio_variance_floor: 0.25
      switch_loss_abs_tol: 1.0e-12
    relation_rebuild:
      min_replay_for_holdout: 3
      switch_validation_tail: 16

  scoring_and_confidence_constants:
    score_warn: 3.0
    score_crit: 5.0
    confidence_formal_base: 0.8
    confidence_source_base: 0.6
    confidence_shadow_base: 0.5
    value_shadow_confidence_cap: 0.8
    ratio_shadow_confidence_cap: 0.8
    value_shadow_sigma_scale: 1.5
    ratio_shadow_score_scale: 1.5

  fusion_constants:
    key_risk_fusion:
      fuse_persistence_window: 3.0
      window_limit: 2
    relation_pattern_fusion:
      lambda_sup: 0.5
      lambda_opp: 0.5
      fuse_persistence_window: 3.0

validation_notes:
  - "support_policy and summary_policy are required for relation task."
  - "k_support must be >= k_stable."
  - "min_hist_share and min_active_ratio must be in (0, 1]."
  - "k_support/k_head/k_stable and delta must be > 0."
  - "baseline_source_configs must not be empty if provided; source_key must not equal self key."
  - "relation encode_type must be exact_sparse or topk_other."
  - "other_group_idx/other_group_idxs are accepted only when encode_type=topk_other."
