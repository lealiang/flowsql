# Baseline config template
# Source snapshot date: 2026-05-03
#
# This template lists the current baseline runtime configuration surface and
# the default values still backed by C++ defaults. Task-derived runtime fields
# such as bucket_seconds, timezone, day_buckets and week_buckets are intentionally
# omitted because they come from each task clock_spec.
#
# Plugin load options:
#   --option "config_file=/abs/path/to/baseline-config-template.yaml;strict=true"

examples:
  tasks:
    value_task:
      schema_version: 1
      task_id: "baseline_task_bps"
      task_name: "link bps baseline"
      task_kind: "value"
      feature_id: "bps"
      feature_type: "value_basic"
      profile: "default"
      clock_spec:
        bucket_seconds: 60
        timezone: "Asia/Shanghai"
      calendar_ref:
        calendar_id: "cn-holiday"
        calendar_version: "2026.1"

    sampled_value_task:
      schema_version: 1
      task_id: "baseline_task_sampled_bps"
      task_name: "sampled link bps baseline"
      task_kind: "value"
      feature_id: "sampled_bps"
      feature_type: "value_sampled"
      profile: "cont_core"
      clock_spec:
        bucket_seconds: 60
        timezone: "Asia/Shanghai"
      calendar_ref:
        calendar_id: "cn-holiday"
        calendar_version: "2026.1"

    ratio_task:
      schema_version: 1
      task_id: "baseline_task_success_rate"
      task_name: "success rate baseline"
      task_kind: "ratio"
      feature_id: "success_rate"
      feature_type: "ratio"
      profile: "rate_core"
      clock_spec:
        bucket_seconds: 60
        timezone: "Asia/Shanghai"
      calendar_ref:
        calendar_id: "cn-holiday"
        calendar_version: "2026.1"

    relation_task:
      schema_version: 1
      task_id: "baseline_task_client_mix"
      task_name: "client mix basis"
      task_kind: "relation"
      feature_id: "client_mix"
      feature_type: "relation"
      profile: "default"
      group_space_id: "client_group"
      group_space_version: "v1"
      metrics:
        - "bps"
      support_policy:
        k_support: 16
        min_hist_share: 0.005
        min_active_ratio: 0.2
      summary_policy:
        k_head: 5
        k_stable: 5
      clock_spec:
        bucket_seconds: 60
        timezone: "Asia/Shanghai"
      calendar_ref:
        calendar_id: "cn-holiday"
        calendar_version: "2026.1"

baseline:
  parser:
    tz_default: "Asia/Shanghai"

  shared_profile_config:
    # Formal model shape. These are the business-level day/week harmonic orders.
    daily_harmonic_order: 6
    weekly_harmonic_order: 3
    dme_max: 7
    m_month_enable: 4
    month_cov_min: 0.8
    lambda_season: 1.0
    lambda_dom: 4.0
    lambda_dme: 2.0
    lambda_lwd: 1.0
    lambda_event: 2.0

  bootstrap:
    # Schema-reserved today. The current runtime parser consumes seed_quality;
    # min_train_points, prediction_band and export_seed are kept visible here
    # for the upcoming config ownership cleanup.
    min_train_points: 2
    seed_quality:
      full_min_coverage_ratio: 0.90
      partial_min_coverage_ratio: 0.50
      daily_min_span_days: 1
      weekly_min_span_days: 14
      daily_phase_coverage_ratio: 0.75
      weekly_phase_coverage_ratio: 0.70
    prediction_band:
      z_value: 3.0
      sigma_floor: 1.0e-3
      low_maturity_band_scale: 1.5
    export_seed:
      include_monthpos_when_ready: true
      include_event_when_ready: true
      include_relation_basis_when_ready: true

  rolling_config:
    # value_sampled observation reliability
    # n_min_score 是最低可评分样本量；n_ref 是达到满权重的样本量，必须 >= n_min_score。
    n_min_score: 3
    n_min_update: 10
    n_ref: 10
    sample_count_noise: 1.0

    # ratio observation reliability
    # d_min_score 是最低可评分分母；d_ref 是达到满权重的分母，必须 >= d_min_score。
    d_min_score: 10
    d_min_update: 100
    d_ref: 100
    ratio_denominator_noise: 1.0

    # anomaly-gated update
    z_downweight: 3.0
    z_skip: 5.0
    small_update_weight: 0.2

    # learning rate scales
    level_learning_scale: 1.0
    day_learning_scale: 0.2
    week_learning_scale: 0.05
    cold_day_learning_scale: 0.05
    cold_week_learning_scale: 0.01
    seasonal_drift_min_scale: 0.1
    full_seed_seasonal_scale: 0.1
    partial_seed_seasonal_scale: 0.5
    freeze_seeded_seasonal_on_drift: true
    day_delta_coeff_max_scale: 0.05
    week_delta_coeff_max_scale: 0.02

    # process noise scales in model space
    q_day_scale: 1.0e-4
    q_week_scale: 2.0e-5
    q_level_scale: 1.0e-3
    q_trend_scale: 1.0e-5
    # 0 表示自动派生为 7 * day_buckets。
    process_noise_gap_cap_buckets: 0

    # trend update controls
    trend_update_scale: 0.05
    cold_trend_update_scale: 0.0
    trend_delta_max_scale: 0.01
    trend_abs_max_scale: 0.1

    # covariance initialization and bounds
    p_level_init_scale: 9.0
    p_trend_init_scale: 16.0
    p_day_init_scale: 4.0
    p_week_init_scale: 9.0
    # P floor/cap 的缩放基准是 sigma_floor^2，不随当前 sigma 动态变化。
    p_floor_scale: 1.0e-6
    p_cap_scale: 1.0e6

    # drift evidence
    # alpha_short = 0.05 is about 20 buckets effective length;
    # alpha_long = 0.005 is about 200 buckets effective length.
    alpha_short: 0.05
    alpha_long: 0.005
    z_cap: 5.0
    drift_start: 1.0
    drift_full: 2.0
    # CUSUM-style level-shift evidence accumulates same-direction residuals over time.
    level_shift_reference_z: 0.5
    level_shift_cusum_decay: 0.98
    level_shift_cusum_threshold: 16.0
    max_level_boost: 4.0
    max_q_boost: 9.0
    skip_relax: 2.0

    # residual scale and band
    alpha_sigma: 0.02
    c_sigma: 3.0
    sigma_floor: 0.05
    cold_start_band_scale: 3.0
    band_z: 1.96
    forecast_band_z: 3.0

    # state maturity
    confidence_cold: 0.2
    confidence_warming: 0.5
    confidence_ready_hint_cap: 0.8
    min_warming_updates: 10
    # 0 表示自动派生为 day_buckets。
    min_ready_hint_updates: 0
    level_ready_min_updates: 30

    # detection trust and calibration
    score_warming_min_updates: 60
    score_ready_min_updates: 240
    score_recovery_min_updates: 120
    score_drift_degrade_start: 1.5
    calibration_alpha: 0.02
    calibration_warmup_min_updates: 60
    calibration_coverage_floor: 0.98
    calibration_tail3_limit: 0.02
    calibration_tail5_limit: 0.002
    calibration_multiplier_min: 1.0
    calibration_multiplier_max: 6.0

    # component readiness and diagnostic uncertainty
    # daily/weekly coverage bins 默认按小时统计周期覆盖；分钟级覆盖可按 day_buckets/week_buckets 调大。
    daily_coverage_bins: 24
    weekly_coverage_bins: 168
    daily_ready_min_days: 2
    daily_ready_coverage_ratio: 0.75
    weekly_ready_min_weeks: 2
    weekly_ready_coverage_ratio: 0.70
    # uncertainty scale 以 sigma^2 为基准形成诊断方差，成熟度和缺失组件两类可加法叠加；
    # 当前只进入 diagnostics/result 字段，不直接进入 detection band 方差。
    maturity_uncertainty_cold_scale: 9.0
    maturity_uncertainty_warming_scale: 4.0
    maturity_uncertainty_drift_scale: 4.0
    maturity_uncertainty_recalibrating_scale: 2.0
    missing_daily_uncertainty_scale: 9.0
    missing_weekly_uncertainty_scale: 4.0
    level_only_extreme_z: 8.0
    detection_band_std_cap: 0.5
    # 0 表示自动派生为 day_buckets。
    forecast_trend_cap_buckets: 0

    # month position slow learning
    monthpos_alpha: 0.005
    monthpos_delta_max_scale: 0.5
    monthpos_min_month_transitions: 2
    monthpos_ready_coverage_ratio: 0.60

    # relation routed rolling and stream basis
    relation_rolling:
      enable_routed_rolling: true
      enable_stream_basis: true
      include_universal_summaries_without_basis: true
      basis_stats_max_groups: 256
      basis_collect_min_buckets: 0
      basis_ready_min_buckets: 0
      basis_refresh_interval_buckets: 0
      basis_candidate_min_coverage_ratio: 0.60
      basis_replacement_cap_ratio: 0.20
      basis_replacement_cap_max: 2
      basis_handover_warmup_buckets: 0
      basis_threshold_margin: 1.20
      basis_min_stable_refresh_count: 2
      routed_state_shard_count: 16
      relation_fusion:
        enable_relation_fusion: true
        fusion_z_score_cap: 5.0
        fusion_min_evidence_score: 0.20
        fusion_persistence_window: 2
        fusion_warming_weight: 0.25
        fusion_degraded_weight: 0.25
        fusion_support_weight: 0.50
        fusion_oppose_weight: 0.50
        basic_pattern_weight: 0.70
        stable_head_pattern_weight: 0.85
        dominant_single_cap: 3
        dominant_pattern_cap: 2
        fusion_state_ttl_buckets: 20160
        fusion_state_max_sources: 4096
        fusion_state_cleanup_interval_updates: 512
        fusion_state_cleanup_scan_limit: 256
        fusion_persistence_max_keys_per_source: 512

  value_sampled_profiles:
    cont_core:
      n_train_min: 50
      transform_name_override: "log1p"
    cont_tail:
      n_train_min: 100
      transform_name_override: "log1p"

  ratio_profiles:
    global:
      eps_logit: 1.0e-4
      m_floor: 1.0e-4
      v_floor: 0.25
    rate_core:
      d_min_train: 50
      s_prior: 2.0
      phi_over: 1.5
    ratio_bursty:
      d_min_train: 100
      s_prior: 4.0
      phi_over: 2.0

  solver_constants:
    solver_name: "weighted_huber_ridge_irls"
    c_huber: 1.5
    s_min_fit: 1.0e-3
    max_iter_fit: 15
    tol_obj_rel: 1.0e-4
    tol_beta_inf: 1.0e-5
    cond_max: 1.0e8

notes:
  validation:
    - "task config uses task_id/task_kind/feature_id/profile/clock_spec/calendar_ref."
    - "historical series identity belongs to BootstrapInput.series_key, not task config."
    - "relation support_policy and summary_policy are required."
