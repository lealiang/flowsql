# Baseline config template
# Source snapshot date: 2026-04-29
#
# Plugin load options:
#   --option "config_file=/abs/path/to/baseline-config-template.yaml;strict=true"

examples:
  tasks:
    value_task:
      schema_version: 1
      task_id: "baseline_task_bps"
      task_name: "link bps baseline"
      task_kind: "value"
      feature_id: "bps"
      feature_type: "value_basic"
      profile: "default"
      clock_spec:
        bucket_seconds: 60
        timezone: "Asia/Shanghai"
      calendar_ref:
        calendar_id: "cn-holiday"
        calendar_version: "2026.1"

    sampled_value_task:
      schema_version: 1
      task_id: "baseline_task_sampled_bps"
      task_name: "sampled link bps baseline"
      task_kind: "value"
      feature_id: "sampled_bps"
      feature_type: "value_sampled"
      profile: "cont_core"
      clock_spec:
        bucket_seconds: 60
        timezone: "Asia/Shanghai"
      calendar_ref:
        calendar_id: "cn-holiday"
        calendar_version: "2026.1"

    ratio_task:
      schema_version: 1
      task_id: "baseline_task_success_rate"
      task_name: "success rate baseline"
      task_kind: "ratio"
      feature_id: "success_rate"
      feature_type: "ratio"
      profile: "rate_core"
      clock_spec:
        bucket_seconds: 60
        timezone: "Asia/Shanghai"
      calendar_ref:
        calendar_id: "cn-holiday"
        calendar_version: "2026.1"

    relation_task:
      schema_version: 1
      task_id: "baseline_task_client_mix"
      task_name: "client mix basis"
      task_kind: "relation"
      feature_id: "client_mix"
      feature_type: "relation"
      profile: "default"
      group_space_id: "client_group"
      group_space_version: "v1"
      metrics:
        - "bps"
      support_policy:
        k_support: 16
        min_hist_share: 0.005
        min_active_ratio: 0.2
      summary_policy:
        k_head: 5
        k_stable: 5
      clock_spec:
        bucket_seconds: 60
        timezone: "Asia/Shanghai"
      calendar_ref:
        calendar_id: "cn-holiday"
        calendar_version: "2026.1"

baseline:
  parser:
    tz_default: "Asia/Shanghai"

  shared_profile_config:
    daily_harmonic_order: 6
    weekly_harmonic_order: 3
    dme_max: 7
    m_month_enable: 4
    month_cov_min: 0.8
    lambda_season: 1.0
    lambda_dom: 4.0
    lambda_dme: 2.0
    lambda_lwd: 1.0
    lambda_event: 2.0

  rolling_config:
    # value_sampled observation reliability
    n_min_score: 3
    n_min_update: 10
    n_ref: 10
    sample_count_noise: 1.0

    # ratio observation reliability
    d_min_score: 10
    d_min_update: 100
    d_ref: 100
    ratio_denominator_noise: 1.0

    # anomaly-gated update
    z_downweight: 3.0
    z_skip: 5.0
    small_update_weight: 0.2

    # harmonic model shape
    daily_harmonic_order: 6
    weekly_harmonic_order: 3

    # learning rate scales
    level_learning_scale: 1.0
    day_learning_scale: 0.2
    week_learning_scale: 0.05
    cold_day_learning_scale: 0.05
    cold_week_learning_scale: 0.01
    seasonal_drift_min_scale: 0.1
    day_delta_coeff_max: 0.05
    week_delta_coeff_max: 0.02

    # process noise scales in model space
    Q_day: 1.0e-4
    Q_week: 2.0e-5
    Q_level: 1.0e-3
    Q_trend: 1.0e-5
    process_noise_gap_cap_buckets: 0

    # trend update controls
    trend_update_scale: 0.05
    cold_trend_update_scale: 0.0
    trend_delta_max: 0.01
    trend_abs_max: 0.1

    # covariance initialization and bounds
    P_level_init: 9.0
    P_trend_init: 16.0
    P_day_init: 4.0
    P_week_init: 9.0
    P_floor: 1.0e-6
    P_cap: 1.0e6

    # drift evidence
    # alpha_short = 0.05 is about 20 buckets effective length;
    # alpha_long = 0.005 is about 200 buckets effective length.
    alpha_short: 0.05
    alpha_long: 0.005
    z_cap: 5.0
    drift_start: 1.0
    drift_full: 2.0
    max_level_boost: 4.0
    max_q_boost: 9.0
    skip_relax: 2.0

    # residual scale and band
    alpha_sigma: 0.02
    c_sigma: 3.0
    sigma_floor: 0.05
    cold_start_band_scale: 3.0
    band_z: 3.0

    # state maturity
    confidence_cold: 0.2
    confidence_warming: 0.5
    confidence_ready_hint_cap: 0.8
    min_warming_updates: 3
    min_ready_hint_updates: 0

  value_sampled_profiles:
    cont_core:
      n_train_min: 50
      transform_name_override: "log1p"
    cont_tail:
      n_train_min: 100
      transform_name_override: "log1p"

  ratio_profiles:
    global:
      eps_logit: 1.0e-4
      m_floor: 1.0e-4
      v_floor: 0.25
    rate_core:
      d_min_train: 50
      s_prior: 2.0
      phi_over: 1.5
    ratio_bursty:
      d_min_train: 100
      s_prior: 4.0
      phi_over: 2.0

  solver_constants:
    solver_name: "weighted_huber_ridge_irls"
    c_huber: 1.5
    s_min_fit: 1.0e-3
    max_iter_fit: 15
    tol_obj_rel: 1.0e-4
    tol_beta_inf: 1.0e-5
    cond_max: 1.0e8

notes:
  validation:
    - "task config uses task_id/task_kind/feature_id/profile/clock_spec/calendar_ref."
    - "historical series identity belongs to BootstrapInput.series_key, not task config."
    - "relation support_policy and summary_policy are required."
